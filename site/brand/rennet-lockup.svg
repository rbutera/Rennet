<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 32" width="156" height="32" role="img" aria-label="Rennet">
  <!--
    Horizontal lockup: mark + word, 9px gap. Word is sans, weight 650, sentence
    case "Rennet", near-neutral tracking (.005em), in bone (--mark-ink). Not the
    serif (serif is reserved for paper), never lowercase, never letterspaced wide.
  -->
  <defs>
    <filter id="lockGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.7" result="blur"/>
      <feFlood flood-color="#85C4DC" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- mark, scaled into a 28px box -->
  <g transform="translate(2 2) scale(0.4375)">
    <path d="M 31 8 A 24 24 0 0 0 31 56 Z" fill="#EDEFF2"/>
    <path d="M 33 8 A 24 24 0 0 1 33 56" fill="none" stroke="#85C4DC"
          stroke-width="3.6" stroke-linecap="round" filter="url(#lockGlow)"/>
  </g>

  <!-- word, 9px after the 28px mark -> x = 2 + 28 + 9 = 39 -->
  <text x="39" y="22"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif"
        font-size="22" font-weight="650" letter-spacing="0.11" fill="#EDEFF2">Rennet</text>
</svg>

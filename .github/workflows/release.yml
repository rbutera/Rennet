name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vX.Y.Z)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: signed macOS draft release
    runs-on: macos-14
    timeout-minutes: 75
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release contract
        run: pnpm release:check -- "${{ inputs.tag }}"

      - name: Run full gate
        run: pnpm check

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/rennet.p12"
          keychain_path="$RUNNER_TEMP/rennet-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "RELEASE_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "RELEASE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')

      - name: Make, sign, notarize, staple, and verify macOS artifacts
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Cloakroom Ltd (${{ secrets.APPLE_TEAM_ID }})"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          rm -rf apps/desktop/out
          pnpm nx run rennet-desktop:make
          pnpm nx run rennet-desktop:package-smoke

          version="$(node -p 'require("./apps/desktop/package.json").version')"
          app="apps/desktop/out/Rennet-darwin-arm64/Rennet.app"
          dmg="apps/desktop/out/make/Rennet-${version}-arm64.dmg"
          zip="apps/desktop/out/make/zip/darwin/arm64/Rennet-darwin-arm64-${version}.zip"
          test -f "$dmg"
          test -f "$zip"

          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl -a -vvv -t exec "$app"

          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t open --context context:primary-signature "$dmg"

          mount_point="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          codesign --verify --deep --strict --verbose=2 "$mount_point/Rennet.app"
          xcrun stapler validate "$mount_point/Rennet.app"
          spctl -a -vvv -t exec "$mount_point/Rennet.app"
          hdiutil detach "$mount_point"
          rmdir "$mount_point"

          shasum -a 256 "$dmg" "$zip" > apps/desktop/out/make/SHA256SUMS

      - name: Upload verified installers
        uses: actions/upload-artifact@v4
        with:
          name: signed-macos-${{ inputs.tag }}
          path: apps/desktop/out/make/**
          if-no-files-found: error
          retention-days: 14

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sha="$(git rev-parse HEAD)"
          node_version="$(node --version)"
          pnpm_version="$(pnpm --version)"
          electron_version="$(node -p 'require("./apps/desktop/package.json").devDependencies.electron')"
          {
            printf 'Signed and notarized macOS release. Windows artifacts remain unsigned.\n\n'
            printf -- '- Version: `%s`\n' "$version"
            printf -- '- Commit: `%s`\n' "$sha"
            printf -- '- Node: `%s`\n' "$node_version"
            printf -- '- pnpm: `%s`\n' "$pnpm_version"
            printf -- '- Electron: `%s`\n\n' "$electron_version"
            printf 'SHA-256:\n```text\n'
            cat apps/desktop/out/make/SHA256SUMS
            printf '```\n'
          } > release-notes.md

          assets=(
            "apps/desktop/out/make/Rennet-${version}-arm64.dmg"
            "apps/desktop/out/make/zip/darwin/arm64/Rennet-darwin-arm64-${version}.zip"
            "apps/desktop/out/make/SHA256SUMS"
          )
          for asset in "${assets[@]}"; do test -f "$asset"; done
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file release-notes.md --generate-notes "${assets[@]}"

      - name: Remove signing material
        if: ${{ always() }}
        run: |
          if [ -n "${RELEASE_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$RELEASE_KEYCHAIN_PATH" || true
          fi
          if [ -n "${RELEASE_CERTIFICATE_PATH:-}" ]; then
            rm -f "$RELEASE_CERTIFICATE_PATH"
          fi

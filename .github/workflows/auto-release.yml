# Auto-release workflow — the live, UNSIGNED release path.
#
# Runs NIGHTLY (not per-merge): one release per day batching everything merged
# since the last tag, and only when app source (apps/desktop, packages, or the
# lockfile) actually changed since that tag. Each release auto-bumps the patch
# version across all 10 workspace package.json files, tags the bump commit
# `vX.Y.Z`, builds installers on macOS + Windows, and publishes a GitHub
# Release with those assets. update.electronjs.org serves auto-updates straight
# from the release assets, so a green run = shipped.
#
# Why nightly: per-merge releasing burned a macOS (10x billing) + Windows (2x)
# build on every app-source merge — six releases in one evening. Batching cuts
# that to at most one per day; `workflow_dispatch` remains the "ship now" lever.
#
# This is deliberately the UNSIGNED path. Code signing + notarization is the
# future SIGNED path in release.yml (issue #42, blocked on RAI-ONLY Apple
# enrolment). This file owns tag creation now; release.yml no longer builds on a
# `v*` tag push (it would double-build).
#
# No release loop is possible: nothing here triggers on push, and the bump
# commit carries `[skip ci]` so it triggers no other workflow either.
name: Auto Release

on:
  # Nightly batch release. 03:00 UTC — quiet hours for the repo.
  schedule:
    - cron: "0 3 * * *"
  # Manual "ship now" lever. `bump` selects the version step (patch default;
  # minor/major for milestone releases like the app-server wave). Dispatch
  # always releases, even if nothing under the app-source paths changed.
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        default: patch
        options: [patch, minor, major]

# One release at a time, end to end. Never cancel a release mid-flight.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 0. Skip the nightly run when nothing releasable changed since the last tag.
  #    App source only — root package.json, docs/, and marketing do NOT count.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.diff.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Any app-source change since the last tag?
        id: diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — releasing unconditionally"
            exit 0
          fi
          latest=$(git describe --tags --match "v*" --abbrev=0)
          # No pipe here: `git diff | head -1` dies of SIGPIPE (exit 141) under
          # pipefail once the range grows past one page. --quiet exits 1 on any
          # difference, which is the only bit we need.
          if ! git diff --quiet "${latest}..HEAD" -- \
            apps/desktop packages pnpm-lock.yaml; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "app source changed since ${latest} — releasing"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no app-source change since ${latest} — skipping"
          fi

  # 1. Full gate on the release commit. Skipping cascades to every downstream
  #    job (each `needs` it, transitively).
  check:
    needs: decide
    if: ${{ needs.decide.outputs.release == 'true' }}
    uses: ./.github/workflows/ci.yml

  # 2. Compute next patch, rewrite versions, commit + annotated tag, push.
  version:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the bump commit + tag
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      # fetch-depth 0 so `git describe --tags` can see the latest release tag.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version, tag, push
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Retry once to survive a race where main moved between fetch and push.
          for attempt in 1 2; do
            git fetch --force --tags origin main
            git reset --hard origin/main

            latest=$(git describe --tags --match "v*" --abbrev=0)
            IFS=. read -r maj min pat <<< "${latest#v}"
            case "${{ github.event.inputs.bump || 'patch' }}" in
              major) next="$((maj + 1)).0.0" ;;
              minor) next="${maj}.$((min + 1)).0" ;;
              *)     next="${maj}.${min}.$((pat + 1))" ;;
            esac
            tag="v${next}"
            echo "latest=${latest} -> next=${tag} (attempt ${attempt})"

            node scripts/set-version.mjs "${next}"
            git add -A
            # [skip ci]: the bump only rewrites version fields, but it touches
            # package.json files that would otherwise trigger CI + Docs runs.
            git commit -m "chore(release): ${tag} [skip ci]"
            git tag -a "${tag}" -m "${tag}"

            # --atomic: main + tag land together or not at all.
            if git push --atomic origin HEAD:main "refs/tags/${tag}"; then
              {
                echo "version=${next}"
                echo "tag=${tag}"
                echo "sha=$(git rev-parse HEAD)"
              } >> "$GITHUB_OUTPUT"
              echo "pushed ${tag}"
              exit 0
            fi

            echo "push rejected (main moved); discarding tag and retrying"
            git tag -d "${tag}" || true
          done

          echo "::error title=Release push failed::main kept moving under the release; giving up after retries"
          exit 1

  # 3. Build the macOS installers from the TAGGED commit (dmg + darwin zip) and
  #    smoke the packaged app before it can ship.
  #    Timeout: normal runs take ~7 min; 20 caps a hung run at 200 billed
  #    minutes (10x macOS multiplier) instead of 400.
  build-macos:
    needs: version
    runs-on: macos-14 # arm64 — matches Rennet-darwin-arm64
    timeout-minutes: 20
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make installers (dmg + zip)
        run: pnpm nx run rennet-desktop:make

      - name: Smoke the packaged app
        run: pnpm nx run rennet-desktop:package-smoke

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: apps/desktop/out/make/**
          if-no-files-found: error
          retention-days: 7

  # 4. Build the Windows installers from the TAGGED commit. MakerSquirrel only
  #    runs on Windows, so this must be a native windows runner. Produces the
  #    Squirrel feed (Setup.exe, *-full.nupkg, RELEASES) plus the win32 zip.
  build-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make installers (squirrel + zip)
        run: pnpm nx run rennet-desktop:make

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: apps/desktop/out/make/**
          if-no-files-found: error
          retention-days: 7

  # 5. Publish the GitHub Release with every installer attached. RELEASES and the
  #    *-full.nupkg keep their exact filenames — the Squirrel.Windows auto-update
  #    feed resolves them by name.
  publish:
    needs: [version, build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
    steps:
      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          name: installers-macos
          path: dist/macos

      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: installers-windows
          path: dist/windows

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          > **Unsigned builds.** These installers are not yet code-signed or notarized.
          >
          > - **macOS:** right-click **Rennet.app** and choose **Open** the first time to get past Gatekeeper.
          > - **Windows:** SmartScreen may warn on first launch — choose **More info → Run anyway**.
          >
          > Auto-updates are served from these release assets via update.electronjs.org.
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job — gh cannot infer the repo from git, so name it.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # NUL-delimited read keeps filenames with spaces (e.g. "Rennet-x Setup.exe") intact.
          assets=()
          while IFS= read -r -d '' f; do assets+=("$f"); done \
            < <(find dist -type f -print0 | sort -z)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no installer assets found to publish"; exit 1
          fi
          printf 'attaching: %s\n' "${assets[@]}"
          # --notes (not --notes-file): gh documents only --notes as combinable
          # with --generate-notes (prepended to the generated notes).
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$(cat notes.md)" \
            --generate-notes \
            "${assets[@]}"

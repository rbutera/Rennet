# Auto-release workflow — the live signed-macOS release path.
#
# Runs NIGHTLY (not per-merge): one release per day batching everything merged
# since the last tag, and only when app source (apps/desktop, packages, or the
# lockfile) actually changed since that tag. Each release auto-bumps the patch
# version across all 10 workspace package.json files, tags the bump commit
# `vX.Y.Z`, builds installers on macOS + Windows, and publishes a GitHub
# Release with those assets. update.electronjs.org serves auto-updates straight
# from the release assets, so a green run = shipped.
#
# Why nightly: per-merge releasing burned a macOS (10x billing) + Windows (2x)
# build on every app-source merge — six releases in one evening. Batching cuts
# that to at most one per day; `workflow_dispatch` remains the "ship now" lever.
#
# macOS artifacts use the same release-environment Developer ID credentials as
# release.yml. Windows stays unsigned until issue #330 supplies its certificate.
#
# No release loop is possible: nothing here triggers on push, and the bump
# commit carries `[skip ci]` so it triggers no other workflow either.
name: Auto Release

on:
  # Nightly batch release. 03:00 UTC — quiet hours for the repo.
  schedule:
    - cron: "0 3 * * *"
  # Manual "ship now" lever. `bump` selects the version step (patch default;
  # minor/major for milestone releases like the app-server wave). Dispatch
  # always releases, even if nothing under the app-source paths changed.
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        default: patch
        options: [patch, minor, major]

# One release at a time, end to end. Never cancel a release mid-flight.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 0. Skip the nightly run when nothing releasable changed since the last tag.
  #    App source only — root package.json, docs/, and marketing do NOT count.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # read CI's own run history for this commit
    outputs:
      release: ${{ steps.diff.outputs.release }}
      gate_passed: ${{ steps.gate.outputs.gate_passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Any app-source change since the last tag?
        id: diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — releasing unconditionally"
            exit 0
          fi
          latest=$(git describe --tags --match "v*" --abbrev=0)
          # No pipe here: `git diff | head -1` dies of SIGPIPE (exit 141) under
          # pipefail once the range grows past one page. --quiet exits 1 on any
          # difference, which is the only bit we need.
          if ! git diff --quiet "${latest}..HEAD" -- \
            apps/desktop packages pnpm-lock.yaml; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "app source changed since ${latest} — releasing"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no app-source change since ${latest} — skipping"
          fi

      # Every commit on main arrives through a push, and CI runs the full gate on
      # that push. Run 33919954862 re-ran it on SHA 69f500f9 thirty-six seconds
      # after run 33919909013 had already passed on that exact SHA. Reusing the
      # verdict is deduplication of an identical answer about an identical
      # commit, not a gate on anything: the gate still has to have passed, it
      # just does not have to pass twice. Anything unknown (no matching run, an
      # API hiccup) resolves to running it.
      - name: Has CI already passed on this exact commit?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `--workflow CI` is the workflow's `name:`; `--status success` filters
          # on the conclusion, so a queued or failed run never counts.
          passed="$(gh run list --workflow CI --commit "$GITHUB_SHA" \
            --event push --status success --json databaseId --jq 'length' || true)"
          case "$passed" in
            ''|*[!0-9]*) passed=0 ;;
          esac
          if [ "$passed" -gt 0 ]; then
            echo "gate_passed=true" >> "$GITHUB_OUTPUT"
            echo "CI already passed on ${GITHUB_SHA} (${passed} successful run(s)) — not re-running it"
          else
            echo "gate_passed=false" >> "$GITHUB_OUTPUT"
            echo "no successful CI run for ${GITHUB_SHA} — running the gate"
          fi

  # 1. Full gate on the release commit, unless CI already passed on this exact
  #    SHA (see `decide`). A skip here does NOT cascade: `version` accepts a
  #    skipped `check` and every later job hangs off `version`.
  check:
    needs: decide
    if: ${{ needs.decide.outputs.release == 'true' && needs.decide.outputs.gate_passed != 'true' }}
    uses: ./.github/workflows/ci.yml

  # 2. Compute next patch, rewrite versions, commit + annotated tag, push.
  #    `always()` is what lets a skipped (already-green) `check` through; the
  #    result check keeps a FAILED gate blocking, which is the load-bearing half.
  version:
    needs: [decide, check]
    if: ${{ always() && needs.decide.outputs.release == 'true' && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the bump commit + tag
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      # fetch-depth 0 so `git describe --tags` can see the latest release tag.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version, tag, push
        id: bump
        env:
          GATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          actual_sha=$(git rev-parse HEAD)
          if [ "$actual_sha" != "$GATED_SHA" ]; then
            echo "::error title=Release checkout drifted::expected gated SHA ${GATED_SHA}, got ${actual_sha}"
            exit 1
          fi

          latest=$(git describe --tags --match "v*" --abbrev=0)
          IFS=. read -r maj min pat <<< "${latest#v}"
          case "${{ github.event.inputs.bump || 'patch' }}" in
            major) next="$((maj + 1)).0.0" ;;
            minor) next="${maj}.$((min + 1)).0" ;;
            *)     next="${maj}.${min}.$((pat + 1))" ;;
          esac
          tag="v${next}"
          echo "latest=${latest} -> next=${tag}"

          node scripts/set-version.mjs "${next}"
          git add -A
          # [skip ci]: the bump only rewrites version fields, but it touches
          # package.json files that would otherwise trigger CI + Docs runs.
          git commit -m "chore(release): ${tag} [skip ci]"
          git tag -a "${tag}" -m "${tag}"

          # The release commit descends from the already-gated SHA. If main moved,
          # this atomic fast-forward push rejects both branch and tag together.
          if ! git push --atomic origin HEAD:main "refs/tags/${tag}"; then
            echo "::error title=Release push failed::main moved after the gated workflow SHA"
            exit 1
          fi

          {
            echo "version=${next}"
            echo "tag=${tag}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "pushed ${tag}"

  # 3. Build the Linux x64 native payload from the exact release SHA descended
  #    from the gated workflow SHA. Windows downloads this same release payload
  #    for its WSL daemon bundle.
  build-linux-native:
    needs: version
    if: ${{ always() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release contract
        run: pnpm release:check -- "${{ needs.version.outputs.tag }}"

      - name: Build and test Linux native payload
        run: pnpm nx run rennet-adapters:native-test
        env:
          NX_DAEMON: "false"

      - name: Verify Linux native payload
        run: node scripts/check-native-artifact-layout.mjs linux-x64

      - name: Upload Linux native payload
        uses: actions/upload-artifact@v4
        with:
          name: rennet-release-native-linux-x64
          path: packages/adapters/dist/native/linux-x64/
          if-no-files-found: error
          retention-days: 7

  # 4. Build the macOS installers from the release SHA (dmg + darwin zip) and
  #    smoke the packaged app before it can ship.
  #    Timeout: normal runs take ~7 min; 20 caps a hung run at 200 billed
  #    minutes (10x macOS multiplier) instead of 400.
  build-macos:
    needs: version
    if: ${{ always() && needs.version.result == 'success' }}
    runs-on: macos-14 # arm64 — matches Rennet-darwin-arm64
    timeout-minutes: 45
    environment: release
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release contract
        run: pnpm release:check -- "${{ needs.version.outputs.tag }}"

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/rennet.p12"
          keychain_path="$RUNNER_TEMP/rennet-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "RELEASE_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "RELEASE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')

      - name: Make, sign, notarize, staple, and verify macOS artifacts
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Cloakroom Ltd (${{ secrets.APPLE_TEAM_ID }})"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          rm -rf apps/desktop/out
          pnpm nx run rennet-desktop:make
          # The smoke script directly, NOT `nx run rennet-desktop:package-smoke`.
          # Forge's `make` packages, signs and notarizes the .app on its way to
          # the DMG, and the Nx target `dependsOn: ["package"]`, so going through
          # Nx here rebuilt adapters/server/desktop and signed and notarized the
          # whole app a second time — 3.5 minutes at the 10x macOS multiplier for
          # a byte-identical result. The Nx target stays as it is: it is the right
          # shape for a local run that starts with no `out/`. Here the app already
          # exists, so smoke exactly that one.
          node scripts/smoke-packaged-app.mjs apps/desktop/out/Rennet-darwin-arm64/Rennet.app
          node scripts/check-native-artifact-layout.mjs darwin-arm64

          version="${{ needs.version.outputs.version }}"
          app="apps/desktop/out/Rennet-darwin-arm64/Rennet.app"
          dmg="apps/desktop/out/make/Rennet-${version}-arm64.dmg"
          zip="apps/desktop/out/make/zip/darwin/arm64/Rennet-darwin-arm64-${version}.zip"
          test -f "$dmg"
          test -f "$zip"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl -a -vvv -t exec "$app"

          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t open --context context:primary-signature "$dmg"
          shasum -a 256 "$dmg" "$zip" > apps/desktop/out/make/SHA256SUMS

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: apps/desktop/out/make/**
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: ${{ always() }}
        run: |
          if [ -n "${RELEASE_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$RELEASE_KEYCHAIN_PATH" || true
          fi
          if [ -n "${RELEASE_CERTIFICATE_PATH:-}" ]; then
            rm -f "$RELEASE_CERTIFICATE_PATH"
          fi

  # 5. Build the Windows installers from the release SHA. MakerSquirrel only
  #    runs on Windows, so this must be a native windows runner. Produces the
  #    Squirrel feed (Setup.exe, *-full.nupkg, RELEASES) plus the win32 zip.
  build-windows:
    needs: [version, build-linux-native]
    if: ${{ always() && needs.version.result == 'success' && needs.build-linux-native.result == 'success' }}
    # Desktop build traverses to adapters; the ruled Electron node-gyp fork
    # recognises Visual Studio only through 2022.
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release contract
        run: pnpm release:check -- "${{ needs.version.outputs.tag }}"

      # The Windows build creates win32-x64 and must preserve this fixed-path
      # Linux sibling for the WSL daemon bundle. Artifact ZIPs normalize file
      # modes; WSL delivery restores and verifies the mover's executable mode.
      - name: Download WSL native payload
        uses: actions/download-artifact@v4
        with:
          name: rennet-release-native-linux-x64
          path: packages/adapters/dist/native/linux-x64

      - name: Verify downloaded WSL native payload
        run: node scripts/check-native-artifact-layout.mjs linux-x64

      - name: Make installers (squirrel + zip)
        run: pnpm nx run rennet-desktop:make

      - name: Verify aggregated native payloads
        run: node scripts/check-native-artifact-layout.mjs win32-x64 linux-x64

      - name: Verify packaged native payloads
        run: node scripts/check-native-artifact-layout.mjs --root "apps/desktop/out/Rennet-win32-x64/resources/app.asar.unpacked/dist/server/native" win32-x64 linux-x64

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: apps/desktop/out/make/**
          if-no-files-found: error
          retention-days: 7

  # 6. Publish the GitHub Release with every installer attached. RELEASES and the
  #    *-full.nupkg keep their exact filenames — the Squirrel.Windows auto-update
  #    feed resolves them by name.
  publish:
    needs: [version, build-macos, build-windows]
    if: ${{ always() && needs.version.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Assert tag matches release SHA
        env:
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          tag_sha=$(git rev-parse "${TAG}^{commit}")
          if [ "$head_sha" != "$RELEASE_SHA" ] || [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo "::error title=Release identity mismatch::HEAD=${head_sha}, ${TAG}=${tag_sha}, expected ${RELEASE_SHA}"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          name: installers-macos
          path: dist/macos

      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: installers-windows
          path: dist/windows

      - name: Write release notes
        run: |
          set -euo pipefail
          find dist -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > dist/SHA256SUMS
          {
            printf '> **macOS:** signed with Developer ID, notarized, and stapled.\n'
            printf '> **Windows:** unsigned until issue #330; SmartScreen may warn on first launch.\n\n'
            printf 'Auto-updates are served from these release assets via update.electronjs.org.\n\n'
            printf -- '- Version: `%s`\n' "${{ needs.version.outputs.version }}"
            printf -- '- Commit: `%s`\n' "${{ needs.version.outputs.sha }}"
            printf -- '- Node: `%s`\n' "$(node --version)"
            printf -- '- pnpm: `%s`\n' "$(pnpm --version)"
            printf -- '- Electron: `%s`\n\n' "$(node -p 'require("./apps/desktop/package.json").devDependencies.electron')"
            printf 'SHA-256:\n```text\n'
            cat dist/SHA256SUMS
            printf '```\n'
          } > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # Name the repository explicitly so release publication never depends on inference.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # NUL-delimited read keeps filenames with spaces (e.g. "Rennet-x Setup.exe") intact.
          #
          # A release asset is addressed by BASENAME, so two files sharing one collide
          # on the second upload. The macOS job ships its own per-platform SHA256SUMS,
          # and the notes step writes a combined dist/SHA256SUMS over the whole set, so
          # "SHA256SUMS" existed twice under dist/ — a collision waiting one upload past
          # wherever v0.3.40's run actually died (its 404 hit the FIRST upload, 3s after
          # create: a propagation race, handled below). The per-platform copies are
          # already folded into the combined file, so only the combined one ships.
          assets=()
          while IFS= read -r -d '' f; do assets+=("$f"); done \
            < <(find dist -mindepth 2 -type f ! -name SHA256SUMS -print0 | sort -z)
          assets+=(dist/SHA256SUMS)
          # Any remaining duplicate basename would fail the same way, mid-upload, after
          # the release exists. Say so here instead, with the name that collides.
          dupes=$(printf '%s\n' "${assets[@]}" | xargs -n1 basename | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::duplicate release asset name(s), GitHub addresses assets by basename: $dupes"
            exit 1
          fi
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no installer assets found to publish"; exit 1
          fi
          printf 'attaching: %s\n' "${assets[@]}"
          # Draft-first, upload-with-retry, undraft-last — not one-shot `gh release
          # create <assets>`. v0.3.40's first failure mode was a propagation race:
          # the first asset POST hit uploads.github.com 3s after the release was
          # created and got a 404 (the record hadn't propagated), and gh deletes the
          # release it just created when an upload fails, losing the publish to a
          # transient. Splitting the phases makes each retryable and the whole job
          # re-runnable from the stored artifacts without rebuilding; --clobber makes
          # retried uploads idempotent. update.electronjs.org only sees the release
          # once it leaves draft, so a failed attempt never half-ships.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # --notes (not --notes-file): gh documents only --notes as combinable
            # with --generate-notes (prepended to the generated notes).
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --notes "$(cat notes.md)" \
              --generate-notes
          fi
          for attempt in 1 2 3; do
            if gh release upload "$TAG" --clobber "${assets[@]}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::asset upload failed after 3 attempts"; exit 1
            fi
            echo "upload attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          uploaded="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          if [ "$uploaded" -ne "${#assets[@]}" ]; then
            echo "::error::expected ${#assets[@]} assets on $TAG, found $uploaded"; exit 1
          fi
          gh release edit "$TAG" --draft=false

  # 7. The tag is pushed by job 2, so from that moment on a version EXISTS whether
  #    or not anything shipped for it. Two runs in one day proved that gap: a
  #    SIGPIPE in `decide` (ca443db0) and pnpm forwarding `--` into `release:check`
  #    (0d38fd73) each ended with a tag and no assets behind it — invisible to an
  #    install that auto-updates from release assets. So this asserts the OUTCOME
  #    per platform, and `always()` makes it run even when publish was skipped,
  #    which is exactly what happened to v0.3.39.
  verify:
    needs: [version, publish]
    if: ${{ always() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Assert tag matches release SHA
        env:
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          tag_sha=$(git rev-parse "${TAG}^{commit}")
          if [ "$head_sha" != "$RELEASE_SHA" ] || [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo "::error title=Release identity mismatch::HEAD=${head_sha}, ${TAG}=${tag_sha}, expected ${RELEASE_SHA}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Assert the tag actually shipped installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # A missing release is the loudest case, so fall back to an empty asset
          # list rather than letting gh's own error stand in for the diagnosis.
          assets="$(gh release view "$TAG" --json assets || echo '{"assets":[]}')"
          # `node`, not `pnpm run`: pnpm forwarding its own `--` is what broke v0.3.39.
          printf '%s' "$assets" | node scripts/check-release-assets.mjs "$TAG" macos windows

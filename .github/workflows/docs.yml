# Docs site build + deploy (Astro Starlight -> Cloudflare Pages).
#
# Builds the root static docsite on every relevant change. When Cloudflare
# credentials are configured, main deploys the production branch of the
# `rennet-docs` Pages project and pull requests deploy preview branches. The
# Pages custom-domain mapping serves the production branch at docs.rennet.dev.
# Without credentials the workflow still proves the complete static build.
#
# Security: read-only token, `pull_request` (never `pull_request_target`). Fork
# PRs cannot read secrets, so the deploy step simply skips for them.
name: Docs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-deploy:
    name: build and deploy docsite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docsite (static)
        run: pnpm nx run rennet-docs:build

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: >-
            pages deploy docs/dist
            --project-name=rennet-docs
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Note when deploy is skipped
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "Docsite built successfully. Cloudflare deploy skipped because the token is not set."

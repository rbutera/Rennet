# CI check gate for Rennet.
#
# Runs the SAME full gate that passes locally: `pnpm check`, which is
#   nx run-many -t format,architecture,licenses,lint,typecheck,test,build
# (authoritative per AGENTS.md "Nx workflow" and package.json `scripts.check`).
# This gate carries its own positive controls that CAN go red: the architecture
# (forbidden-import) check and the licenses check each assert a deliberate-failure
# calibration, so a green run is meaningful, not decoration.
#
# The full gate runs on Linux, including both Linux native artifacts. A focused
# matrix below compiles both first-party artifacts, exercises their native
# semantics, proves repeatable host builds, and uploads the exact platform
# payload on Linux, macOS, and Windows. That matrix runs only when its own
# inputs changed (see the `changes` job). CI deliberately does NOT run:
#   - `e2e`     (Playwright + Electron; needs a display, not part of `pnpm check`)
#   - `package` / `package-smoke` (Electron packaging; macOS-only, lives in the
#                 signed release workflows and issue #298's distribution slice)
#   - `audit`   (network-dependent; not part of the local gate)
#   - `t3:test` (the upstream T3 Code suites — T3 test their own code, and we are
#                not responsible for it. The script stays as a manual tool.)
#
# Security: read-only token, no secrets, `pull_request` (never `pull_request_target`).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Reusable so the release workflow runs this exact gate without duplicating it.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check (format · architecture · licenses · lint · typecheck · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 — some adapters tests dogfood the real repo git history
      # (project-snapshot-generator.test.ts runs `git rev-parse HEAD~1`), which the
      # default shallow (depth 1) clone cannot satisfy.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Those same dogfood tests resolve `main` by name. On a pull_request the
      # checkout is a detached merge ref with no local `main`, so materialise it.
      # On a push to main we are already on the branch, so the guard skips.
      - name: Ensure a local `main` ref (for repo-dogfood tests)
        run: |
          git rev-parse --verify --quiet refs/heads/main >/dev/null \
            || git fetch --no-tags origin +refs/heads/main:refs/heads/main

      # pnpm must be on PATH before setup-node so `cache: pnpm` can resolve the store.
      # action-setup reads the exact version from package.json `packageManager`
      # (pnpm@10.32.1) — no hardcoded version to drift.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Node version comes from .nvmrc (24.18.0). `.npmrc` sets engine-strict=true,
      # so the install FAILS if the runner Node differs — pinning here is load-bearing.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Nx remote cache via an in-CI proxy. Nx 23's local DB cache is not portable
      # across CI runs (mandatory SQLite sync check rejects restored artifacts). A
      # self-hosted remote cache (NX_SELF_HOSTED_REMOTE_CACHE_SERVER, Nx 20.8+)
      # bypasses that check entirely. The proxy is a ~100-line Node HTTP server
      # (tools/nx-cache-proxy.mjs) implementing PUT/GET /v1/cache/{hash}, backed by
      # a local directory that actions/cache persists across runs. Zero cost, no Nx
      # Cloud, no external infrastructure.
      - name: Restore Nx remote cache
        uses: actions/cache@v4
        with:
          path: /tmp/nx-remote-cache
          key: nx-remote-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-remote-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Nx cache proxy
        run: |
          node tools/nx-cache-proxy.mjs &
          # Wait for the server to be ready before proceeding.
          for i in 1 2 3 4 5; do
            curl -sf http://127.0.0.1:4210/healthz >/dev/null 2>&1 && break
            sleep 1
          done

      # The gate. Fails the job (and therefore the PR) if any target fails.
      - name: Check
        run: pnpm check
        env:
          NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://127.0.0.1:4210

  # Decide whether the native matrix below has anything to say. The matrix is
  # three OS jobs, and macOS bills at 10x with Windows at 2x, so a day of ~35
  # runs spent ~840 billed minutes recompiling a helper nobody touched. This is
  # not a gate on anyone: when none of the matrix's inputs changed, the verdict
  # it would produce is the one it already produced, so it does not need to run
  # again. Anything it cannot decide (force push, branch creation, the release
  # calling in) resolves to running the matrix.
  changes:
    name: native inputs changed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      # fetch-depth: 0 so the base commit of the comparison is present locally.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did anything the native matrix builds change?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          run_matrix() {
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "$1"
            exit 0
          }
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push)         base="$PUSH_BEFORE" ;;
            # A reusable workflow reports the CALLER's event, never
            # "workflow_call", so anything that is not this workflow's own
            # pull_request/push trigger is auto-release calling in. The release
            # must produce the native artifacts, so always build them.
            *) run_matrix "invoked via workflow_call (caller event: ${EVENT}) — building native artifacts" ;;
          esac
          # Empty base, the all-zero SHA (branch creation), or a base this clone
          # cannot resolve (a force push rewrote it) means the diff is unknowable.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            run_matrix "cannot resolve base '${base}' — building native artifacts"
          fi
          # Every file whose content decides what this matrix compiles or asserts:
          # the C sources and their build/layout/determinism scripts, the tests
          # that exercise them, the adapters project (which defines the targets),
          # the lockfile and Node pin the toolchain resolves from, and this file.
          changed=$(git diff --name-only "$base" HEAD -- \
            packages/adapters/native \
            'packages/adapters/project.json' \
            'packages/adapters/src/exclusive-namespace-move*.ts' \
            'packages/adapters/src/rooted-landing-host*.ts' \
            'scripts/build-exclusive-namespace-move.mjs' \
            'scripts/check-exclusive-namespace-move-determinism.mjs' \
            'scripts/check-native-artifact-layout.mjs' \
            'scripts/native-artifact-staging.mjs' \
            'pnpm-lock.yaml' \
            '.nvmrc' \
            '.github/workflows/ci.yml')
          if [ -n "$changed" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "native inputs changed:"
            echo "$changed"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "no native input changed between ${base} and $(git rev-parse HEAD) — skipping the matrix"
          fi

  exclusive-namespace-move:
    name: exclusive namespace move (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The exact-SHA Electron node-gyp fork recognises Visual Studio through
        # 2022. Keep Windows fixed until that ruled toolchain gains VS 2026.
        include:
          - os: ubuntu-latest
            native: linux-x64
          - os: macos-14
            native: darwin-arm64
          - os: windows-2022
            native: win32-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test native artifacts
        run: pnpm nx run rennet-adapters:native-test
        env:
          NX_DAEMON: "false"

      - name: Verify reproducible native build
        run: pnpm nx run rennet-adapters:native-determinism-test
        env:
          NX_DAEMON: "false"

      - name: Verify native artifact layout
        run: node scripts/check-native-artifact-layout.mjs "${{ matrix.native }}"

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rennet-native-${{ matrix.native }}
          path: packages/adapters/dist/native/${{ matrix.native }}/
          if-no-files-found: error
          retention-days: 7
